
name: Update Game Engine Documentation

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Force multi-engine database snapshot upgrade"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: cloud-rag-documentation-update
  cancel-in-progress: false

jobs:
  update-documentation:
    runs-on: ubuntu-latest

    outputs:
      docs_changed: ${{ steps.docs_changes.outputs.changed }}
      should_deploy: ${{ steps.docs_changes.outputs.changed == 'true' || inputs.bootstrap == true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install requests beautifulsoup4

      - name: Fetch game engine documentation
        run: |
          python fetch_unity.py
          python fetch_engine_docs.py

      - name: Detect documentation changes
        id: docs_changes
        run: |
          if [ -n "$(git status --porcelain -- data/unity/ data/godot/ data/unreal/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Game engine documentation has changed."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No game engine documentation changes detected."
          fi

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.2.0

      - name: Restore existing Chroma database
        env:
          CHROMA_DB_DIR: ./chroma_unity_test
        run: |
          python restore_chroma.py

      - name: Migrate legacy Unity metadata
        env:
          CHROMA_DB_DIR: ./chroma_unity_test
        run: |
          python migrate_metadata.py

      - name: Incrementally ingest all game engines
        env:
          CHROMA_DB_DIR: ./chroma_unity_test
        run: |
          python ingest_unity.py
          python ingest_engine_docs.py

      - name: Validate multi-engine database
        env:
          CHROMA_DB_DIR: ./chroma_unity_test
        run: |
          python validate_chroma.py

      - name: Create updated Chroma snapshot
        if: steps.docs_changes.outputs.changed == 'true' || inputs.bootstrap == true
        env:
          CHROMA_DB_DIR: ./chroma_unity_test
          CHROMA_SNAPSHOT_PATH: ./chroma-snapshot.tar.gz
        run: |
          python snapshot_chroma.py

      - name: Validate updated Chroma snapshot
        if: steps.docs_changes.outputs.changed == 'true' || inputs.bootstrap == true
        run: |
          python - <<'PY'
          import tarfile
          import tempfile
          from pathlib import Path
          import chromadb

          with tempfile.TemporaryDirectory() as temp:
              with tarfile.open("chroma-snapshot.tar.gz", "r:gz") as archive:
                  members = archive.getmembers()

                  for member in members:
                      path = Path(member.name)
                      if (
                          path.is_absolute()
                          or ".." in path.parts
                          or not path.parts
                          or path.parts[0] != "chroma_unity_test"
                          or not (member.isfile() or member.isdir())
                      ):
                          raise ValueError(f"Invalid archive member: {member.name}")

                  archive.extractall(temp, filter="data")

              db_path = Path(temp) / "chroma_unity_test"

              if not (db_path / "chroma.sqlite3").is_file():
                  raise RuntimeError("Snapshot is missing chroma.sqlite3")

              client = chromadb.PersistentClient(path=str(db_path))
              collections = client.list_collections()

              if not collections:
                  raise RuntimeError("Snapshot contains no collections")

              total_chunks = sum(c.count() for c in collections)

              if total_chunks == 0:
                  raise RuntimeError("Snapshot contains no document chunks")

              collection = client.get_collection("langchain")
              records = collection.get(include=["metadatas"])

              from collections import Counter

              counts = Counter(
                  metadata.get("source_type", "legacy")
                  for metadata in records["metadatas"]
              )

              required_engines = {"unity", "godot", "unreal"}

              missing = required_engines - {
                  engine for engine, count in counts.items()
                  if count > 0
              }

              if missing:
                  raise RuntimeError(
                      f"Snapshot missing engines: {sorted(missing)}"
                  )

              print(f"Snapshot validation passed: {total_chunks} chunks")
              print(f"Engine distribution: {dict(counts)}")
          PY

      - name: Run automated tests
        run: |
          python -m pytest tests/ -v

      - name: Upload validated snapshot artifact
        if: steps.docs_changes.outputs.changed == 'true' || inputs.bootstrap == true
        uses: actions/upload-artifact@v4
        with:
          name: validated-chroma-snapshot
          path: chroma-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload updated documentation artifact
        if: steps.docs_changes.outputs.changed == 'true' || inputs.bootstrap == true
        uses: actions/upload-artifact@v4
        with:
          name: updated-game-engine-documentation
          path: data/
          if-no-files-found: error
          retention-days: 1

  deploy-documentation:
    name: Deploy updated documentation
    needs: update-documentation
    if: needs.update-documentation.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    concurrency:
      group: cloud-rag-azure-deployment
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Capture production image and verify multi-engine API support
        run: |
          set -euo pipefail
          previous_image=$(az containerapp show \
            --name cloud-rag-api \
            --resource-group rg-cloud-rag-pipeline \
            --query 'properties.template.containers[0].image' -o tsv)
          test -n "$previous_image"
          echo "PREVIOUS_IMAGE=$previous_image" >> "$GITHUB_ENV"

          # Fail safely if the image has not been upgraded to multi-engine support.
          # A 200 response is not sufficient: old APIs may ignore the engine field.
          python - <<'PYCODE'
          import json, urllib.request
          url = 'https://cloud-rag-api.icypebble-38736748.swedencentral.azurecontainerapps.io/openapi.json'
          with urllib.request.urlopen(url, timeout=90) as response:
              spec = json.load(response)
          schemas = spec.get('components', {}).get('schemas', {})
          request_schema = schemas.get('QuestionRequest', {})
          props = request_schema.get('properties', {})
          engine = props.get('engine', {})
          if not engine:
              raise RuntimeError('Production API lacks engine selection. Deploy new image first.')
          print('Production API exposes engine selection.')
          PYCODE

      - name: Download validated Chroma snapshot
        uses: actions/download-artifact@v4
        with:
          name: validated-chroma-snapshot
          path: .

      - name: Download updated game engine documentation
        uses: actions/download-artifact@v4
        with:
          name: updated-game-engine-documentation
          path: /tmp/updated-docs

      - name: Synchronize documentation into checkout
        run: |
          for engine in unity godot unreal; do
            test -d "/tmp/updated-docs/$engine"
            mkdir -p "data/$engine"
            rsync -a --delete "/tmp/updated-docs/$engine/" "data/$engine/"
          done

      - name: Capture production Blob state and create verified backup
        id: verify_backup
        run: |
          set -euo pipefail
          account=cloudragstorearya26
          container=chroma-snapshots
          production=chroma-unity-snapshot-clean.tar.gz
          backup="chroma-unity-backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          echo "BACKUP_BLOB_NAME=$backup" >> "$GITHUB_ENV"

          # Capture ETag before backup; reject concurrent modifications.
          original_etag=$(az storage blob show --account-name "$account" \
            --container-name "$container" --name "$production" \
            --auth-mode login --query properties.etag -o tsv)
          test -n "$original_etag"
          echo "ORIGINAL_ETAG=$original_etag" >> "$GITHUB_ENV"

          az storage blob copy start --account-name "$account" \
            --destination-container "$container" --destination-blob "$backup" \
            --source-container "$container" --source-blob "$production" \
            --auth-mode login --output none

          for _ in {1..60}; do
            status=$(az storage blob show --account-name "$account" \
              --container-name "$container" --name "$backup" \
              --auth-mode login --query properties.copy.status -o tsv)
            if [ "$status" = success ]; then break; fi
            if [ "$status" = failed ] || [ "$status" = aborted ]; then exit 1; fi
            sleep 2
          done
          if [ "$status" != success ]; then echo 'Backup copy timed out'; exit 1; fi

          mkdir -p /tmp/chroma-backup-check
          az storage blob download --account-name "$account" \
            --container-name "$container" --name "$production" \
            --file /tmp/chroma-backup-check/production.tar.gz \
            --auth-mode login --output none
          az storage blob download --account-name "$account" \
            --container-name "$container" --name "$backup" \
            --file /tmp/chroma-backup-check/backup.tar.gz \
            --auth-mode login --output none
          cmp /tmp/chroma-backup-check/production.tar.gz /tmp/chroma-backup-check/backup.tar.gz
          current_etag=$(az storage blob show --account-name "$account" \
            --container-name "$container" --name "$production" \
            --auth-mode login --query properties.etag -o tsv)
          if [ "$current_etag" != "$original_etag" ]; then
            echo 'Production changed while backup was being created; aborting.'
            exit 1
          fi
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Promote validated snapshot with conditional upload
        id: promote_snapshot
        run: |
          set -euo pipefail
          # Direct conditional upload avoids asynchronous copy-ID ownership races.
          # Mark attempt first so rollback can inspect whether the upload took effect.
          echo 'attempted=true' >> "$GITHUB_OUTPUT"
          az storage blob upload \
            --account-name cloudragstorearya26 \
            --container-name chroma-snapshots \
            --name chroma-unity-snapshot-clean.tar.gz \
            --file chroma-snapshot.tar.gz \
            --auth-mode login --overwrite true \
            --if-match "$ORIGINAL_ETAG" --output none
          echo 'completed=true' >> "$GITHUB_OUTPUT"

          # Capture the new ETag only after checking that the content matches.
          az storage blob download \
            --account-name cloudragstorearya26 \
            --container-name chroma-snapshots \
            --name chroma-unity-snapshot-clean.tar.gz \
            --file /tmp/chroma-promoted.tar.gz \
            --auth-mode login --output none
          cmp chroma-snapshot.tar.gz /tmp/chroma-promoted.tar.gz
          new_etag=$(az storage blob show \
            --account-name cloudragstorearya26 \
            --container-name chroma-snapshots \
            --name chroma-unity-snapshot-clean.tar.gz \
            --auth-mode login --query properties.etag -o tsv)
          test -n "$new_etag"
          echo "PROMOTED_ETAG=$new_etag" >> "$GITHUB_ENV"
          echo 'Snapshot promoted and verified.'

      - name: Deploy updated Chroma snapshot
        run: |
          deploy_version="docs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "Deploying snapshot version: $deploy_version"

          az containerapp update \
            --name cloud-rag-api \
            --resource-group rg-cloud-rag-pipeline \
            --set-env-vars DEPLOY_VERSION="$deploy_version" \
            --output none

      - name: Verify deployed API health
        run: |
          api_url="https://cloud-rag-api.icypebble-38736748.swedencentral.azurecontainerapps.io/health"

          for attempt in {1..30}; do
            echo "Health check attempt $attempt/30"

            if curl --fail --silent --show-error \
              --max-time 15 \
              "$api_url"; then
              echo ""
              echo "API health check passed."
              exit 0
            fi

            echo "API not ready yet. Retrying in 10 seconds..."
            sleep 10
          done

          echo "ERROR: API did not become healthy."
          exit 1

      - name: Verify deployed RAG functionality
        run: |
          python - <<'PYCODE'
          import json
          import time
          import urllib.request

          url = "https://cloud-rag-api.icypebble-38736748.swedencentral.azurecontainerapps.io/ask"

          questions = {
              "unity": "What does SpriteRenderer do?",
              "godot": "How does RigidBody2D work?",
              "unreal": "What is an Actor?",
          }

          for engine, question in questions.items():
              payload = json.dumps({
                  "question": question,
                  "engine": engine,
              }).encode("utf-8")

              for attempt in range(1, 4):
                  try:
                      request = urllib.request.Request(
                          url,
                          data=payload,
                          headers={"Content-Type": "application/json"},
                          method="POST",
                      )

                      with urllib.request.urlopen(
                          request, timeout=90
                      ) as response:
                          result = json.load(response)

                      answer = result.get("answer")
                      sources = result.get("sources", [])

                      if not isinstance(answer, str) or not answer.strip():
                          raise RuntimeError("Empty RAG answer")

                      if not sources:
                          raise RuntimeError("No retrieved sources")

                      for source in sources:
                          metadata = source.get("metadata", {})
                          if metadata.get("source_type") != engine:
                              raise RuntimeError(
                                  f"Incorrect source for {engine}: {metadata}"
                              )

                      print(f"{engine.upper()} RAG verification passed!")
                      break

                  except Exception as error:
                      print(
                          f"{engine} attempt {attempt}/3 failed: {error}",
                          flush=True,
                      )
                      if attempt == 3:
                          raise
                      time.sleep(10)
          PYCODE

      - name: Roll back failed production deployment
        if: ${{ failure() && steps.verify_backup.outputs.verified == 'true' && steps.promote_snapshot.outputs.attempted == 'true' }}
        run: |
          set -euo pipefail
          account=cloudragstorearya26
          container=chroma-snapshots
          production=chroma-unity-snapshot-clean.tar.gz
          backup_file=/tmp/chroma-backup-check/backup.tar.gz
          test -s "$backup_file"
          test -n "${PREVIOUS_IMAGE:-}"
          test -n "${ORIGINAL_ETAG:-}"

          # If promotion failed before changing the Blob, leave it untouched.
          state=$(az storage blob show --account-name "$account" \
            --container-name "$container" --name "$production" \
            --auth-mode login --query '{etag:properties.etag,status:properties.copy.status}' -o json)
          current_etag=$(printf '%s' "$state" | python -c 'import json,sys; print(json.load(sys.stdin)["etag"])')
          current_status=$(printf '%s' "$state" | python -c 'import json,sys; print(json.load(sys.stdin).get("status") or "")')
          if [ "$current_etag" = "$ORIGINAL_ETAG" ]; then
            echo 'Production snapshot was not changed; no Blob rollback needed.'
            exit 0
          fi
          if [ "$current_status" = pending ]; then
            echo 'Unexpected pending copy; automatic rollback stopped.'
            exit 1
          fi

          # A failed upload can succeed server-side without returning an ETag.
          # Only restore when the current Blob exactly matches our intended snapshot.
          az storage blob download --account-name "$account" \
            --container-name "$container" --name "$production" \
            --file /tmp/chroma-before-rollback.tar.gz \
            --auth-mode login --output none
          if ! cmp -s chroma-snapshot.tar.gz /tmp/chroma-before-rollback.tar.gz; then
            echo 'Production does not match this run snapshot; manual recovery required.'
            exit 1
          fi
          # ETag precondition protects against a concurrent change after inspection.
          az storage blob upload --account-name "$account" \
            --container-name "$container" --name "$production" \
            --file "$backup_file" --auth-mode login --overwrite true \
            --if-match "$current_etag" --output none
          az storage blob download --account-name "$account" \
            --container-name "$container" --name "$production" \
            --file /tmp/chroma-rollback-check.tar.gz \
            --auth-mode login --output none
          cmp "$backup_file" /tmp/chroma-rollback-check.tar.gz

          az containerapp update --name cloud-rag-api \
            --resource-group rg-cloud-rag-pipeline \
            --image "$PREVIOUS_IMAGE" \
            --set-env-vars DEPLOY_VERSION="rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output none
          echo 'Snapshot restored and previous image redeployed.'

      - name: Commit documentation updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- data/unity/ data/godot/ data/unreal/

          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
          else
            git commit -m "Automatically update game engine documentation"
            git push origin HEAD:main
          fi
