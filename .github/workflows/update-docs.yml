
name: Update Game Engine Documentation

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Force multi-engine database snapshot upgrade"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-rag-documentation-update
  cancel-in-progress: false

env:
  LUDEX_SNAPSHOT_BLOB: chroma-ludex-expanded-v2.tar.gz
  LUDEX_DOCUMENTATION_BLOB: ludex-documentation-state.tar.gz

jobs:
  update-documentation:
    runs-on: ubuntu-latest

    outputs:
      docs_changed: ${{ steps.docs_changes.outputs.changed }}
      should_deploy: ${{ steps.docs_changes.outputs.changed == 'true' || inputs.bootstrap == true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crawler and Azure dependencies
        run: |
          python -m pip install requests beautifulsoup4 azure-identity azure-storage-blob

      - name: Restore documentation state from Azure
        run: |
          python documentation_state.py download

      - name: Record documentation state before downloading
        run: |
          python - <<'PYCODE'
          import hashlib
          import json
          from pathlib import Path

          state = {}

          for engine in ("unity", "godot"):
              folder = Path("data/automatic") / engine
              state[engine] = {
                  file.name: hashlib.sha256(file.read_bytes()).hexdigest()
                  for file in folder.glob("*.txt")
              }

          Path("/tmp/ludex-documentation-before.json").write_text(
              json.dumps(state),
              encoding="utf-8",
          )

          print("Documentation baseline recorded.")
          PYCODE

      - name: Download missing Unity documentation
        run: |
          python download_discovered_docs.py --engine unity --max-pages 1500 --delay 0.5

      - name: Download missing Godot documentation
        run: |
          python download_discovered_docs.py --engine godot --max-pages 1500 --delay 1.0

      - name: Detect documentation changes
        id: docs_changes
        run: |
          python - <<'PYCODE'
          import hashlib
          import json
          import os
          from pathlib import Path

          before = json.loads(
              Path("/tmp/ludex-documentation-before.json").read_text()
          )

          changed = False

          for engine in ("unity", "godot"):
              folder = Path("data/automatic") / engine

              current = {
                  file.name: hashlib.sha256(file.read_bytes()).hexdigest()
                  for file in folder.glob("*.txt")
              }

              previous = before.get(engine, {})

              added = len(current.keys() - previous.keys())
              removed = len(previous.keys() - current.keys())
              modified = sum(
                  current[name] != previous[name]
                  for name in current.keys() & previous.keys()
              )

              print(
                  f"{engine}: {added} added, "
                  f"{modified} modified, {removed} removed"
              )

              changed |= (added + modified + removed) > 0

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"changed={str(changed).lower()}\n")
          PYCODE

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.2.0

      - name: Restore existing Ludex Chroma database
        env:
          CHROMA_DB_DIR: ./chroma_unity_test
          CHROMA_BLOB_NAME: ${{ env.LUDEX_SNAPSHOT_BLOB }}
        run: |
          python restore_chroma.py

      - name: Normalize legacy Chroma source paths
        env:
          CHROMA_DB_DIR: ./chroma_unity_test
        run: |
          python normalize_chroma_sources.py

      - name: Incrementally ingest Unity and Godot
        env:
          CHROMA_DB_DIR: ./chroma_unity_test
        run: |
          python ingest_ludex_docs.py

      - name: Validate multi-engine database
        env:
          CHROMA_DB_DIR: ./chroma_unity_test
        run: |
          python validate_chroma.py

      - name: Create updated Chroma snapshot
        if: steps.docs_changes.outputs.changed == 'true' || inputs.bootstrap == true
        env:
          CHROMA_DB_DIR: ./chroma_unity_test
          CHROMA_SNAPSHOT_PATH: ./chroma-snapshot.tar.gz
        run: |
          python snapshot_chroma.py

      - name: Validate updated Chroma snapshot
        if: steps.docs_changes.outputs.changed == 'true' || inputs.bootstrap == true
        run: |
          python - <<'PYCODE'
          import tarfile
          import tempfile
          from pathlib import Path

          from validate_chroma import validate_database

          with tempfile.TemporaryDirectory() as temp:
              with tarfile.open("chroma-snapshot.tar.gz", "r:gz") as archive:
                  members = archive.getmembers()

                  if not members:
                      raise RuntimeError("Snapshot archive is empty")

                  for member in members:
                      path = Path(member.name)

                      if (
                          path.is_absolute()
                          or ".." in path.parts
                          or not path.parts
                          or path.parts[0] != "chroma_unity_test"
                          or not (member.isfile() or member.isdir())
                      ):
                          raise ValueError(
                              f"Invalid archive member: {member.name}"
                          )

                  archive.extractall(temp, filter="data")

              db_path = Path(temp) / "chroma_unity_test"
              validate_database(db_path)

          print("PASS: Snapshot archive and database validated.")
          PYCODE

      - name: Run automated tests
        run: |
          python -m pytest tests/ -v

      - name: Upload validated snapshot artifact
        if: steps.docs_changes.outputs.changed == 'true' || inputs.bootstrap == true
        uses: actions/upload-artifact@v4
        with:
          name: validated-chroma-snapshot
          path: chroma-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Package updated documentation state
        if: steps.docs_changes.outputs.changed == 'true' || inputs.bootstrap == true
        run: |
          python -c "from documentation_state import create_archive; create_archive()"

      - name: Upload documentation state artifact
        if: steps.docs_changes.outputs.changed == 'true' || inputs.bootstrap == true
        uses: actions/upload-artifact@v4
        with:
          name: ludex-documentation-state
          path: ludex-documentation-state.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Persist crawler progress without deployment
        if: ${{ steps.docs_changes.outputs.changed == 'false' && inputs.bootstrap != true }}
        run: |
          python documentation_state.py upload

  deploy-documentation:
    name: Deploy updated documentation
    needs: update-documentation
    if: needs.update-documentation.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    concurrency:
      group: cloud-rag-azure-deployment
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Azure documentation-state dependencies
        run: |
          python -m pip install azure-identity azure-storage-blob

      - name: Capture production image and verify multi-engine API support
        run: |
          set -euo pipefail
          previous_image=$(az containerapp show \
            --name cloud-rag-api \
            --resource-group rg-cloud-rag-pipeline \
            --query 'properties.template.containers[0].image' -o tsv)
          test -n "$previous_image"
          echo "PREVIOUS_IMAGE=$previous_image" >> "$GITHUB_ENV"
          previous_deploy_version=$(az containerapp show \
            --name cloud-rag-api \
            --resource-group rg-cloud-rag-pipeline \
            --query "properties.template.containers[0].env[?name=='DEPLOY_VERSION'].value | [0]" \
            -o tsv)
          test -n "$previous_deploy_version"

          echo "PREVIOUS_DEPLOY_VERSION=$previous_deploy_version" >> "$GITHUB_ENV"
          echo "Previous deployment version: $previous_deploy_version"

          # Fail safely if the image has not been upgraded to multi-engine support.
          # A 200 response is not sufficient: old APIs may ignore the engine field.
          python - <<'PYCODE'
          import json, urllib.request
          url = 'https://cloud-rag-api.icypebble-38736748.swedencentral.azurecontainerapps.io/openapi.json'
          with urllib.request.urlopen(url, timeout=90) as response:
              spec = json.load(response)
          schemas = spec.get('components', {}).get('schemas', {})
          request_schema = schemas.get('QuestionRequest', {})
          props = request_schema.get('properties', {})
          engine = props.get('engine', {})
          if not engine:
              raise RuntimeError('Production API lacks engine selection. Deploy new image first.')
          print('Production API exposes engine selection.')
          PYCODE

      - name: Download validated Chroma snapshot
        uses: actions/download-artifact@v4
        with:
          name: validated-chroma-snapshot
          path: .

      - name: Download documentation state artifact
        uses: actions/download-artifact@v4
        with:
          name: ludex-documentation-state
          path: .

      - name: Restore updated documentation state
        run: |
          python - <<'PYCODE'
          from documentation_state import safe_extract

          safe_extract("ludex-documentation-state.tar.gz")
          print("Updated documentation state restored.")
          PYCODE

      - name: Capture production Blob state and create verified backup
        id: verify_backup
        run: |
          set -euo pipefail
          account=cloudragstorearya26
          container=chroma-snapshots
          production="$LUDEX_SNAPSHOT_BLOB"
          backup="chroma-unity-backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          echo "BACKUP_BLOB_NAME=$backup" >> "$GITHUB_ENV"

          # Capture ETag before backup; reject concurrent modifications.
          original_etag=$(az storage blob show --account-name "$account" \
            --container-name "$container" --name "$production" \
            --auth-mode login --query properties.etag -o tsv)
          test -n "$original_etag"
          echo "ORIGINAL_ETAG=$original_etag" >> "$GITHUB_ENV"

          mkdir -p /tmp/chroma-backup-check
          echo 'Downloading existing production snapshot for backup.'
          az storage blob download --account-name "$account" \
            --container-name "$container" --name "$production" \
            --file /tmp/chroma-backup-check/production.tar.gz \
            --auth-mode login --output none

          # Do not back up bytes from a different production revision.
          downloaded_etag=$(az storage blob show --account-name "$account" \
            --container-name "$container" --name "$production" \
            --auth-mode login --query properties.etag -o tsv)
          if [ "$downloaded_etag" != "$original_etag" ]; then
            echo 'Production changed during download; aborting.'
            exit 1
          fi

          echo 'Uploading independent backup with Microsoft Entra authentication.'
          az storage blob upload --account-name "$account" \
            --container-name "$container" --name "$backup" \
            --file /tmp/chroma-backup-check/production.tar.gz \
            --auth-mode login --overwrite false --output none

          echo 'Downloading backup to verify bytes.'
          az storage blob download --account-name "$account" \
            --container-name "$container" --name "$backup" \
            --file /tmp/chroma-backup-check/backup.tar.gz \
            --auth-mode login --output none
          cmp /tmp/chroma-backup-check/production.tar.gz /tmp/chroma-backup-check/backup.tar.gz
          current_etag=$(az storage blob show --account-name "$account" \
            --container-name "$container" --name "$production" \
            --auth-mode login --query properties.etag -o tsv)
          if [ "$current_etag" != "$original_etag" ]; then
            echo 'Production changed while backup was being created; aborting.'
            exit 1
          fi
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Promote validated snapshot with conditional upload
        id: promote_snapshot
        run: |
          set -euo pipefail
          # Direct conditional upload avoids asynchronous copy-ID ownership races.
          # Mark attempt first so rollback can inspect whether the upload took effect.
          echo 'attempted=true' >> "$GITHUB_OUTPUT"
          az storage blob upload \
            --account-name cloudragstorearya26 \
            --container-name chroma-snapshots \
            --name "$LUDEX_SNAPSHOT_BLOB" \
            --file chroma-snapshot.tar.gz \
            --auth-mode login --overwrite true \
            --if-match "$ORIGINAL_ETAG" --output none
          echo 'completed=true' >> "$GITHUB_OUTPUT"

          # Capture the new ETag only after checking that the content matches.
          az storage blob download \
            --account-name cloudragstorearya26 \
            --container-name chroma-snapshots \
            --name "$LUDEX_SNAPSHOT_BLOB" \
            --file /tmp/chroma-promoted.tar.gz \
            --auth-mode login --output none
          cmp chroma-snapshot.tar.gz /tmp/chroma-promoted.tar.gz
          new_etag=$(az storage blob show \
            --account-name cloudragstorearya26 \
            --container-name chroma-snapshots \
            --name "$LUDEX_SNAPSHOT_BLOB" \
            --auth-mode login --query properties.etag -o tsv)
          test -n "$new_etag"
          echo "PROMOTED_ETAG=$new_etag" >> "$GITHUB_ENV"
          echo 'Snapshot promoted and verified.'

      - name: Deploy updated Chroma snapshot
        id: deploy_snapshot
        run: |
          set -euo pipefail
          deploy_version="docs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "TARGET_DEPLOY_VERSION=$deploy_version" >> "$GITHUB_ENV"
          echo 'attempted=true' >> "$GITHUB_OUTPUT"

          echo "Deploying snapshot version: $deploy_version"

          az containerapp update \
            --name cloud-rag-api \
            --resource-group rg-cloud-rag-pipeline \
            --set-env-vars DEPLOY_VERSION="$deploy_version" \
            --output none

      - name: Verify deployed API health
        run: |
          api_url="https://cloud-rag-api.icypebble-38736748.swedencentral.azurecontainerapps.io/health"

          for attempt in {1..30}; do
            echo "Health check attempt $attempt/30"

            if curl --fail --silent --show-error \
              --max-time 15 \
              "$api_url"; then
              echo ""
              echo "API health check passed."
              exit 0
            fi

            echo "API not ready yet. Retrying in 10 seconds..."
            sleep 10
          done

          echo "ERROR: API did not become healthy."
          exit 1

      - name: Verify deployed RAG functionality
        run: |
          python - <<'PYCODE'
          import json
          import time
          import urllib.request

          url = "https://cloud-rag-api.icypebble-38736748.swedencentral.azurecontainerapps.io/ask"

          questions = {
              "unity": "What does SpriteRenderer do?",
              "godot": "How does RigidBody2D work?",
          }

          for engine, question in questions.items():
              payload = json.dumps({
                  "question": question,
                  "engine": engine,
              }).encode("utf-8")

              for attempt in range(1, 4):
                  try:
                      request = urllib.request.Request(
                          url,
                          data=payload,
                          headers={"Content-Type": "application/json"},
                          method="POST",
                      )

                      with urllib.request.urlopen(
                          request, timeout=90
                      ) as response:
                          result = json.load(response)

                      answer = result.get("answer")
                      sources = result.get("sources", [])

                      if not isinstance(answer, str) or not answer.strip():
                          raise RuntimeError("Empty RAG answer")

                      if not sources:
                          raise RuntimeError("No retrieved sources")

                      for source in sources:
                          metadata = source.get("metadata", {})
                          if metadata.get("source_type") != engine:
                              raise RuntimeError(
                                  f"Incorrect source for {engine}: {metadata}"
                              )

                      print(f"{engine.upper()} RAG verification passed!")
                      break

                  except Exception as error:
                      print(
                          f"{engine} attempt {attempt}/3 failed: {error}",
                          flush=True,
                      )
                      if attempt == 3:
                          raise
                      time.sleep(10)
          PYCODE

      - name: Roll back failed production deployment
        if: ${{ failure() && steps.verify_backup.outputs.verified == 'true' && steps.promote_snapshot.outputs.attempted == 'true' }}
        run: |
          set -euo pipefail
          account=cloudragstorearya26
          container=chroma-snapshots
          production="$LUDEX_SNAPSHOT_BLOB"
          backup_file=/tmp/chroma-backup-check/backup.tar.gz
          test -s "$backup_file"
          test -n "${PREVIOUS_IMAGE:-}"
          test -n "${PREVIOUS_DEPLOY_VERSION:-}"
          test -n "${ORIGINAL_ETAG:-}"

          # Do not roll back a different image or a newer deployment's revision.
          current_image=$(az containerapp show --name cloud-rag-api \
            --resource-group rg-cloud-rag-pipeline \
            --query 'properties.template.containers[0].image' -o tsv)
          current_version=$(az containerapp show --name cloud-rag-api \
            --resource-group rg-cloud-rag-pipeline \
            --query "properties.template.containers[0].env[?name=='DEPLOY_VERSION'].value | [0]" -o tsv)
          if [ "$current_image" != "$PREVIOUS_IMAGE" ]; then
            echo 'Container image changed since this run began; manual recovery required.'
            exit 1
          fi
          if [ "$current_version" != "$PREVIOUS_DEPLOY_VERSION" ] && \
             [ "$current_version" != "${TARGET_DEPLOY_VERSION:-}" ]; then
            echo 'Container revision changed since this run began; manual recovery required.'
            exit 1
          fi

          current_etag=$(az storage blob show --account-name "$account" \
            --container-name "$container" --name "$production" \
            --auth-mode login --query properties.etag -o tsv)

          if [ "$current_etag" = "$ORIGINAL_ETAG" ]; then
            echo 'Production Blob unchanged; skipping Blob restoration.'
          else
            # Restore only if the production Blob still contains our snapshot.
            az storage blob download --account-name "$account" \
              --container-name "$container" --name "$production" \
              --file /tmp/chroma-before-rollback.tar.gz \
              --auth-mode login --output none
            if ! cmp -s chroma-snapshot.tar.gz /tmp/chroma-before-rollback.tar.gz; then
              echo 'Blob differs from this run snapshot; manual recovery required.'
              exit 1
            fi
            az storage blob upload --account-name "$account" \
              --container-name "$container" --name "$production" \
              --file "$backup_file" --auth-mode login --overwrite true \
              --if-match "$current_etag" --output none
            az storage blob download --account-name "$account" \
              --container-name "$container" --name "$production" \
              --file /tmp/chroma-rollback-check.tar.gz \
              --auth-mode login --output none
            cmp "$backup_file" /tmp/chroma-rollback-check.tar.gz
            echo 'Previous production Blob restored and verified.'
          fi

          # The docs deployment changes DEPLOY_VERSION, not the image.
          # Restore the prior value only if our deployment changed it.
          if [ "$current_version" = "${TARGET_DEPLOY_VERSION:-}" ]; then
            az containerapp update --name cloud-rag-api \
              --resource-group rg-cloud-rag-pipeline \
              --set-env-vars DEPLOY_VERSION="$PREVIOUS_DEPLOY_VERSION" \
              --output none
            echo 'Previous deployment version restored.'
          else
            echo 'Previous deployment version is already configured.'
          fi

          # A new revision is necessary when the Blob was reverted but our
          # updated revision was already running; an unchanged version means
          # the original revision should still have its original local DB.
          api_url='https://cloud-rag-api.icypebble-38736748.swedencentral.azurecontainerapps.io/health'
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 15 "$api_url" > /dev/null; then
              echo 'Rollback health check passed.'
              exit 0
            fi
            echo "Rollback health check $attempt/30 failed."
            sleep 10
          done
          echo 'Rollback health verification failed; inspect Azure manually.'
          exit 1

      - name: Persist verified documentation state to Azure
        if: ${{ success() && steps.promote_snapshot.outputs.completed == 'true' }}
        run: |
          python documentation_state.py upload
