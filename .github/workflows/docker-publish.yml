
name: Publish and Deploy Docker Image

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/unity/**"
      - "data/godot/**"
      - "data/unreal/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: cloud-rag-azure-deployment
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/shadowstormez/cloud-rag-pipeline:latest
            ghcr.io/shadowstormez/cloud-rag-pipeline:sha-${{ github.sha }}
          platforms: linux/amd64

      - name: Log in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Capture previous production image
        run: |
          set -euo pipefail
          previous_image=$(az containerapp show \
            --name cloud-rag-api --resource-group rg-cloud-rag-pipeline \
            --query 'properties.template.containers[0].image' -o tsv)
          test -n "$previous_image"
          echo "PREVIOUS_IMAGE=$previous_image" >> "$GITHUB_ENV"

      - name: Deploy image to Azure Container Apps
        id: deploy
        run: |
          set -euo pipefail
          echo 'attempted=true' >> "$GITHUB_OUTPUT"
          az containerapp update \
            --name cloud-rag-api \
            --resource-group rg-cloud-rag-pipeline \
            --image ghcr.io/shadowstormez/cloud-rag-pipeline:sha-${{ github.sha }} \
            --output none

      - name: Verify deployed API
        run: |
          set -euo pipefail
          url='https://cloud-rag-api.icypebble-38736748.swedencentral.azurecontainerapps.io'
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 20 "$url/health" > /dev/null; then
              echo 'API health check passed.'
              exit 0
            fi
            echo "Health attempt $attempt/30 failed."
            sleep 10
          done
          echo 'New image failed health verification.'
          exit 1

      - name: Restore previous image on failure
        if: ${{ failure() && steps.deploy.outputs.attempted == 'true' }}
        run: |
          set -euo pipefail
          test -n "${PREVIOUS_IMAGE:-}"
          current_image=$(az containerapp show --name cloud-rag-api \
            --resource-group rg-cloud-rag-pipeline \
            --query 'properties.template.containers[0].image' -o tsv)
          target_image='ghcr.io/shadowstormez/cloud-rag-pipeline:sha-${{ github.sha }}'
          if [ "$current_image" = "$PREVIOUS_IMAGE" ]; then
            echo 'Previous image already configured; no rollback necessary.'
            exit 0
          fi
          if [ "$current_image" != "$target_image" ]; then
            echo 'Image changed by another operation; manual recovery required.'
            exit 1
          fi
          az containerapp update --name cloud-rag-api \
            --resource-group rg-cloud-rag-pipeline \
            --image "$PREVIOUS_IMAGE" --output none
          echo 'Previous image restored; verify application health manually.'
