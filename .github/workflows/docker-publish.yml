
name: Publish and Deploy Docker Image

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/unity/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: cloud-rag-azure-deployment
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/shadowstormez/cloud-rag-pipeline:latest
            ghcr.io/shadowstormez/cloud-rag-pipeline:sha-${{ github.sha }}
          platforms: linux/amd64

      - name: Log in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy image to Azure Container Apps
        run: |
          az containerapp update \
            --name cloud-rag-api \
            --resource-group rg-cloud-rag-pipeline \
            --image ghcr.io/shadowstormez/cloud-rag-pipeline:sha-${{ github.sha }}
