name: Python CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: |
          python -m compileall -q -x '(^|/)(\.venv|chroma_db|chroma_unity_test)/' .

      - name: Install test dependencies
        run: |
          python -m pip install pytest==9.2.0 requests beautifulsoup4

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v